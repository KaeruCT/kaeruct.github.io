<meta name="twitter:card" content="summary_large_image" />
<meta property="twitter:domain"
      content='{{ trim (trim .Site.BaseURL "http://") "https://" }}'
/>
<meta property="twitter:url" content="{{ .Permalink | absURL }}" />

{{ if .IsPage }}
    <meta name="twitter:title" content="{{ .Title }}" />
    
    <meta name="twitter:image" content="{{ partial "meta_image.html" . }}" />
    <meta name="twitter:description" content="{{ partial "meta_description.html" . }}" />
{{ else }}
    <meta name="twitter:title"
        content='{{ .Site.Title | default "Ficurinia" }}' />
    {{ if .Site.Params.description }}
        <meta name="twitter:description" content="{{ .Site.Params.description }}" />
    {{ end }}
    <meta name="twitter:image" content="{{ partial "meta_image.html" . }}" />
{{ end }}
